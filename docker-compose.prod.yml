services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - main-service
      - items-service
    restart: unless-stopped

  main-service:
    image: ghcr.io/peppercatastrophe/simple-golang-nginx-example/main-service:latest
    container_name: main-service
    env_file: .env
    pull_policy: always
    expose:
      - "8081"
    restart: unless-stopped

  items-service:
    image: ghcr.io/peppercatastrophe/simple-golang-nginx-example/items-service:latest
    container_name: items-service
    env_file: .env
    pull_policy: always
    expose:
      - "8082"
    restart: unless-stopped
